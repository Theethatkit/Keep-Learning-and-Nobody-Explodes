<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | DataLab</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- CSS: register.html is inside the html folder -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="min-h-screen bg-slate-950 text-white">

    <!-- Header -->
    <header
        class="flex items-center justify-between
               border-b border-cyan-400/20
               bg-slate-950/90 px-8 py-6
               md:px-16"
    >

        <nav class="hidden gap-8 md:flex">
            <a
                href="../index.html"
                class="text-slate-300 transition hover:text-cyan-400"
            >
                Home
            </a>

            <a
                href="lessons.html"
                class="text-slate-300 transition hover:text-cyan-400"
            >
                Learn
            </a>

            <a
                href="revision.html"
                class="text-slate-300 transition hover:text-cyan-400"
            >
                Revision
            </a>
        </nav>
    </header>

    <!-- Register section -->
    <main
        class="flex min-h-[calc(100vh-89px)]
               items-center justify-center
               bg-gray-100 px-6 py-12"
    >

        <!-- Card container -->
        <div class="relative w-full max-w-md">

            <!-- Cyan card behind the form -->
            <div
                class="absolute inset-0 rotate-[-6deg]
                       rounded-3xl
                       bg-gradient-to-br
                       from-cyan-400 to-sky-500
                       shadow-xl"
            ></div>

            <!-- White register card -->
            <div
                class="relative rounded-3xl bg-white
                       px-10 py-12 shadow-2xl
                       sm:px-16"
            >
                <h1 class="mb-8 text-3xl font-bold text-slate-900">
                    Register
                </h1>

                <form id="registerForm" class="space-y-6">

                    <!-- Username -->
                    <div>
                        <label
                            for="username"
                            class="mb-2 block text-sm font-medium
                                   text-slate-600"
                        >
                            Username
                        </label>

                        <input
                            id="username"
                            name="username"
                            type="text"
                            required
                            autocomplete="username"
                            class="w-full border-b-2 border-gray-300
                                   bg-transparent px-1 py-2
                                   text-slate-900 outline-none
                                   transition focus:border-cyan-500"
                        >
                    </div>

                    <!-- Gmail -->
                    <div>
                        <label
                            for="email"
                            class="mb-2 block text-sm font-medium
                                   text-slate-600"
                        >
                            Gmail Address
                        </label>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            required
                            autocomplete="email"
                            placeholder="example@gmail.com"
                            class="w-full border-b-2 border-gray-300
                                   bg-transparent px-1 py-2
                                   text-slate-900 outline-none
                                   transition focus:border-cyan-500"
                        >
                    </div>

                    <!-- Password -->
                    <div>
                        <label
                            for="password"
                            class="mb-2 block text-sm font-medium
                                   text-slate-600"
                        >
                            Password
                        </label>

                        <input
                            id="password"
                            name="password"
                            type="password"
                            required
                            minlength="6"
                            autocomplete="new-password"
                            class="w-full border-b-2 border-gray-300
                                   bg-transparent px-1 py-2
                                   text-slate-900 outline-none
                                   transition focus:border-cyan-500"
                        >

                        <p class="mt-2 text-xs text-gray-400">
                            Password must contain at least 6 characters.
                        </p>
                    </div>

                    <!-- Register button -->
                    <button
                        type="submit"
                        class="w-full rounded-lg bg-cyan-500
                               px-4 py-3 font-semibold text-white
                               transition hover:bg-cyan-600"
                    >
                        Create Account
                    </button>

                    <!-- Login link -->
                    <p class="text-center text-sm text-slate-600">
                        Already have an account?

                        <a
                            href="login.html"
                            class="font-semibold text-cyan-600
                                   hover:underline"
                        >
                            Log in
                        </a>
                    </p>

                </form>
            </div>
        </div>
    </main>

    <!-- Register JavaScript -->
    <script src="../js/register.js"></script>

</body>
</html>
