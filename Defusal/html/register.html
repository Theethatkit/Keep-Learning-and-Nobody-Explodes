<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | DataLab</title>

    <!-- Register CSS -->
    <link rel="stylesheet" href="../css/register.css">
</head>

<body>

    <!-- HEADER -->
    <header class="navbar">

        <nav class="nav-links">

            <a href="../index.html" class="nav-link">
                Home
            </a>

            <a href="lessons.html" class="nav-link">
                Learn
            </a>

            <a href="revision.html" class="nav-link">
                Revision
            </a>

        </nav>

    </header>

    <!-- REGISTER SECTION -->
    <main class="auth-section">

        <!-- Card container -->
        <div class="card-container">

            <!-- Cyan card behind the form -->
            <div class="cyan-card"></div>

            <!-- White register card -->
            <div class="form-card">

                <h1>Register</h1>

                <form id="registerForm" class="auth-form">

                    <!-- Username -->
                    <div>
                        <label
                            for="username"
                            class="form-label"
                        >
                            Username
                        </label>

                        <input
                            id="username"
                            name="username"
                            type="text"
                            required
                            autocomplete="username"
                            class="form-input"
                        >
                    </div>

                    <!-- Gmail -->
                    <div>
                        <label
                            for="email"
                            class="form-label"
                        >
                            Gmail Address
                        </label>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            required
                            autocomplete="email"
                            placeholder="example@gmail.com"
                            class="form-input"
                        >
                    </div>

                    <!-- Password -->
                    <div>
                        <label
                            for="password"
                            class="form-label"
                        >
                            Password
                        </label>

                        <input
                            id="password"
                            name="password"
                            type="password"
                            required
                            minlength="6"
                            autocomplete="new-password"
                            class="form-input"
                        >

                        <p class="password-help">
                            Password must contain at least 6 characters.
                        </p>
                    </div>

                    <!-- Register button -->
                    <button
                        type="submit"
                        class="submit-button"
                    >
                        Create Account
                    </button>

                    <!-- Login link -->
                    <p class="switch-page">
                        Already have an account?

                        <a
                            href="login.html"
                            class="switch-link"
                        >
                            Log in
                        </a>
                    </p>

                </form>

            </div>

        </div>

    </main>

    <!-- Register JavaScript -->
    <script src="../js/register.js"></script>

</body>

</html>
