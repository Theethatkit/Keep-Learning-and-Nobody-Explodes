<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Learn Data Structures | DataLab</title>

    <!-- Login CSS -->
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <!-- HEADER -->
    <header class="navbar">

        <!-- Navigation -->
        <nav class="nav-links">

            <a href="../index.html" class="nav-link">
                Home
            </a>

        </nav>

    </header>

    <!-- LOGIN SECTION -->
    <main class="auth-section">

        <!-- Card container -->
        <div class="card-container">

            <!-- Cyan background card -->
            <div class="cyan-card"></div>

            <!-- White login card -->
            <div class="form-card">

                <h1>Login</h1>

                <form id="loginForm" class="auth-form">

                    <!-- Email -->
                    <div>
                        <label for="email" class="form-label">
                            Email Address
                        </label>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            required
                            autocomplete="email"
                            class="form-input"
                        >
                    </div>

                    <!-- Password -->
                    <div>
                        <label for="password" class="form-label">
                            Password
                        </label>

                        <input
                            id="password"
                            name="password"
                            type="password"
                            required
                            autocomplete="current-password"
                            class="form-input"
                        >
                    </div>

                    <!-- Login button -->
                    <button
                        type="submit"
                        class="submit-button"
                    >
                        Login
                    </button>

                    <!-- Register link -->
                    <p class="switch-page">
                        Don't have an account?

                        <a
                            href="register.html"
                            class="switch-link"
                        >
                            Register
                        </a>
                    </p>

                </form>

            </div>

        </div>

    </main>

    <!-- Login JavaScript -->
    <script src="../js/login.js"></script>

</body>

</html>
