<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Data Structure Learning</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="css/index.css">
</head>

<body>

    <main id="home" class="home-page">

        <!-- Navigation bar -->
        <header class="navbar">

            <!-- Logo -->
            <a href="index.html">
                <img
                    src="images/Logo.png"
                    alt="Data Structure Learning Logo"
                    class="logo"
                >
            </a>

            <!-- Navigation links -->
            <nav class="nav-links">

                <a
                    id="learnButton"
                    href="html/lessons.html"
                    class="nav-link"
                >
                    Learn
                </a>

                <a
                    id="reviseButton"
                    href="html/revision.html"
                    class="nav-link"
                >
                    Revision
                </a>

                <a
                    id="teamButton"
                    href="html/team.html"
                    class="nav-link"
                >
                    Team
                </a>

            </nav>

            <!-- Login / Logout button -->
            <a
                id="authButton"
                href="html/login.html"
                class="auth-button"
            >
                Log in
            </a>

        </header>

        <!-- Hero section -->
        <section class="hero-section">

            <!-- Background video -->
            <video
                class="background-video"
                autoplay
                muted
                loop
                playsinline
            >
                <source
                    src="video/mainpageBg.mp4"
                    type="video/mp4"
                >
            </video>

            <!-- Dark layer over the video -->
            <div class="dark-overlay"></div>

            <!-- Main content -->
            <div class="hero-content">

                <div class="hero-card">

                    <p class="small-heading">
                        INTERACTIVE LEARNING WEBSITE
                    </p>

                    <h1 class="main-heading">
                        Keep-Learning
                        <br>
                        AND
                        <br>
                        Nobody-Explodes
                    </h1>

                    <p class="description">
                        Learn the basic concepts of data structures,
                        visualize how they work, and revise your knowledge
                        through interactive challenges.
                    </p>

                    <a
                        id="startLearningButton"
                        href="html/lessons.html"
                        class="start-button"
                    >
                        START LEARNING
                    </a>

                </div>

            </div>

        </section>

    </main>

    <script>
        const loggedInUser =
            localStorage.getItem("loggedInUser");

        const authButton =
            document.getElementById("authButton");

        const protectedButtons = [
            document.getElementById("startLearningButton"),
            document.getElementById("learnButton"),
            document.getElementById("reviseButton"),
            document.getElementById("teamButton")
        ];

        // Change Log in to Log out when the user is logged in
        if (loggedInUser) {
            authButton.textContent = "Log out";
            authButton.href = "#";

            authButton.addEventListener("click", function (event) {
                event.preventDefault();

                localStorage.removeItem("loggedInUser");

                window.location.reload();
            });
        }

        // Require login before opening protected pages
        protectedButtons.forEach(function (button) {
            button.addEventListener("click", function (event) {
                if (!localStorage.getItem("loggedInUser")) {
                    event.preventDefault();

                    window.location.href = "html/login.html";
                }
            });
        });
    </script>

    <script src="js/script.js"></script>

</body>

</html>
