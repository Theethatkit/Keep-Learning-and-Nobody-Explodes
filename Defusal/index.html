<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Data Structure Learning</title>

    

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main id="home" class="min-h-screen bg-slate-950">
        <!-- Navigation bar -->
        <header
            class="relative z-10 flex items-center bg-slate-900
                   justify-between px-12 py-6
                   md:px-16"
        >
            <!-- Logo -->
            <a href="index.html"><img src="images/Logo.png" alt="Logo" class="h-20"></a>

            <!-- Navigation links -->
            <nav class="hidden gap-8 text-xl md:flex">

                <a
                    id="learnButton"
                    href="html/lessons.html"
                    class="text-white transition hover:text-cyan-400"
                >
                    Learn
                </a>

                <a
                    id="reviseButton"
                    href="html/revision.html"
                    class="text-white transition hover:text-cyan-400"
                >
                    Revision
                </a>

                <a
                    id="teamButton"
                    href="html/team.html"
                    class="text-white transition hover:text-cyan-400"
                >
                    Team
                </a>

            </nav>

            <!-- Login / Logout button -->
            <a
                id="authButton"
                href="html/login.html"
                class="rounded-full border border-white
                px-5 py-2 text-white
                transition
                hover:border-cyan-400
                hover:bg-cyan-400
                hover:text-slate-950"
            >
                Log in
            </a>

        </header>

        <!-- Main content -->
         
        <section class="relative min-h-[calc(100vh-128px)] overflow-hidden">

        <!-- Background video -->
            <video
                class="absolute inset-0 z-0 h-full w-full object-cover"
                autoplay
                muted
                loop
                playsinline
            >
            <source src="video/mainpageBg.mp4" type="video/mp4">
            </video>

            <!-- Dark overlay -->
            <div class="absolute inset-0 z-10 bg-slate-950/30"></div>

            <!-- Main content -->
            <div
                class="relative z-20 flex min-h-[calc(100vh-128px)]
                items-center justify-center px-6 text-center"
            >
                <div
                    class="max-w-4xl rounded-3xl
                    border border-cyan-400/20
                    bg-slate-950/70 px-10 py-12
                    shadow-2xl backdrop-blur-sm
                    md:px-16 md:py-14"
                >

                    <!-- Small heading -->
                    <p
                        class="mb-4 text-sm font-semibold
                        tracking-[0.35em] text-cyan-400"
                    >
                    INTERACTIVE LEARNING WEBSITE
                    </p>

                    <!-- Main heading -->
                    <h1
                        class="mb-6 text-5xl font-black leading-tight
                        text-white md:text-7xl"
                    >
                    Keep-Learning
                    <br>
                    AND
                    <br>
                    Nobody-Explodes
                    </h1>

                    <!-- Description -->
                    <p
                        class="mx-auto mb-9 max-w-2xl text-base
                        leading-7 text-slate-200 md:text-lg"
                    >
                    Learn the basic concepts of data structures,
                    visualize how they work, and revise your knowledge
                    through interactive challenges.
                    </p>

                    <!-- Main button -->
                    <a
                        id="startLearningButton"
                        href="html/lessons.html"
                        class="inline-block rounded-full border
                        border-cyan-400 bg-cyan-400 px-8 py-3
                        font-semibold text-slate-950
                        transition duration-300
                        hover:bg-transparent hover:text-cyan-400"
                    >
                    START LEARNING
                    </a>

                </div>
            </div>

        </section>

    </main>

    <script>
    const loggedInUser = localStorage.getItem("loggedInUser");
    const authButton = document.getElementById("authButton");
    const startLearningButton =
        document.getElementById("startLearningButton");
    const learnButton = document.getElementById("learnButton");
    const reviseButton = document.getElementById("reviseButton");
    const teamButton = document.getElementById("teamButton");

    if (loggedInUser) {
        // if the user is logged in, change the button to "Log out"
        authButton.textContent = "Log out";
        authButton.href = "#";

        authButton.addEventListener("click", function (event) {
            event.preventDefault();
            localStorage.removeItem("loggedInUser");
            window.location.reload();
        });
    }

    startLearningButton.addEventListener("click", function (event) {
        // if not logged in, redirect to login page
        if (!localStorage.getItem("loggedInUser")) {
            event.preventDefault();
            window.location.href = "html/login.html";
        }
    });
    learnButton.addEventListener("click", function (event) {
        // if not logged in, redirect to login page
        if (!localStorage.getItem("loggedInUser")) {
            event.preventDefault();
            window.location.href = "html/login.html";
        }
    });
    reviseButton.addEventListener("click", function (event) {
        // if not logged in, redirect to login page
        if (!localStorage.getItem("loggedInUser")) {
            event.preventDefault();
            window.location.href = "html/login.html";
        }
    });
    teamButton.addEventListener("click", function (event) {
        // if not logged in, redirect to login page
        if (!localStorage.getItem("loggedInUser")) {
            event.preventDefault();
            window.location.href = "html/login.html";
        }
    });
    </script>
    <script src="js/script.js"></script>
</body>

</html>
