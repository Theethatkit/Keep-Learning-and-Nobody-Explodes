<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Data Structure Learning</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>

    <!-- Main page -->
    <main
        id="home"
        class="relative min-h-screen bg-cover bg-center"
        style="background-image: url('images/background.jpg');"
    >

        <!-- Dark overlay -->
        <div class="absolute inset-0 bg-black/60"></div>

        <!-- Navigation bar -->
        <header
            class="relative z-10 flex items-center
                   justify-between px-12 py-6
                   md:px-16"
        >

            <a href="#home"><img src="images/Logo.png" alt="Logo" class="h-40"></a>

            <!-- Navigation links -->
            <nav class="hidden gap-8 text-xl md:flex">

                <a
                    href="lessons.html"
                    class="text-white transition hover:text-cyan-400"
                >
                    Lessons
                </a>

                <a
                    href="revision.html"
                    class="text-white transition hover:text-cyan-400"
                >
                    Revision
                </a>

                <a
                    href="team.html"
                    class="text-white transition hover:text-cyan-400"
                >
                    Team
                </a>

            </nav>

            <!-- Login button -->
            <button
                class="rounded-full border border-white
                       px-5 py-2 text-white
                       transition
                       hover:border-cyan-400
                       hover:bg-cyan-400
                       hover:text-slate-950"
            >
                Log in
            </button>

        </header>

        <!-- Main content -->
        <section
            class="relative z-10 flex min-h-[calc(100vh-96px)]
                   items-center justify-center
                   px-6 text-center"
        >

            <div class="max-w-4xl">

                <!-- Small heading -->
                <p
                    class="mb-4 text-sm font-semibold
                           tracking-[0.35em] text-cyan-400"
                >
                    INTERACTIVE LEARNING WEBSITE
                </p>

                <!-- Main heading -->
                <h1
                    class="mb-6 text-5xl font-black
                           leading-tight text-white
                           md:text-7xl"
                >
                    LEARN DATA STRUCTURES
                    <br>

                </h1>

                <!-- Description -->
                <p
                    class="mx-auto mb-9 max-w-2xl
                           text-base leading-7 text-gray-200
                           md:text-lg"
                >
                    Learn the basic concepts of data structures,
                    visualize how they work, and revise your knowledge
                    through interactive challenges.
                </p>

                <!-- Main button -->
                <a
                    href="lessons.html"
                    class="inline-block rounded-full
                           border border-cyan-400
                           bg-cyan-400 px-8 py-3
                           font-semibold text-slate-950
                           transition duration-300
                           hover:bg-transparent
                           hover:text-cyan-400"
                >
                    START LEARNING
                </a>

            </div>

        </section>

    </main>

    

</body>

</html>
